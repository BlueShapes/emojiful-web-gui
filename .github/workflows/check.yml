name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile
      - run: bun run check && bun run test
      - run: sh gradlew build --no-daemon
      - run: bun run deploy:check
      - run: bunx playwright install --with-deps chromium-headless-shell
      - run: bun run test:e2e
      - run: bun run test:workers
      - uses: actions/upload-artifact@v4
        with:
          name: emojiful-web-gui-forge-1.20.1
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: emojiful-web-gui-static
          path: web/dist
